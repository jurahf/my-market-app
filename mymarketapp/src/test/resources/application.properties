spring.r2dbc.url=r2dbc:h2:mem:///memdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.r2dbc.username=sa
spring.r2dbc.password=

spring.r2dbc.init.mode=always
spring.r2dbc.init.schema-locations=classpath:schema.sql
spring.r2dbc.init.data-locations=classpath:empty.sql

payment.service.base-url=http://localhost:8081
spring.security.oauth2.client.registration.paymentservice.client-id=test-client
spring.security.oauth2.client.registration.paymentservice.client-secret=test-secret
spring.security.oauth2.client.registration.paymentservice.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.paymentservice.token-uri=http://localhost:8082/realms/master/protocol/openid-connect/token
